<!doctype html>
<html lang="km">
  <head>
    <meta charset="utf-8" />
    <title>SvaType launch video</title>
    <style>
      @font-face {
        font-family: 'Kantumruy Pro';
        src: url('/public/fonts/KantumruyPro-SemiBold.woff2') format('woff2');
        font-weight: 600;
      }
      @font-face {
        font-family: 'Kantumruy Pro';
        src: url('/public/fonts/KantumruyPro.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Noto Sans Khmer';
        src: url('/public/fonts/NotoSansKhmer-SemiBold.woff2') format('woff2');
        font-weight: 600;
      }
      @font-face {
        font-family: 'Noto Sans Khmer';
        src: url('/public/fonts/NotoSansKhmer.woff2') format('woff2');
        font-weight: 400;
      }
      :root {
        --teal: #176b62;
        --teal-2: #1f8a7e;
        --mint: #8bdbc2;
        --gold: #e9b94c;
        --ink: #071c19;
        --paper: #f7f8fa;
        --muted: #a9c7bf;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
      }
      body {
        font-family: 'Kantumruy Pro', 'Noto Sans Khmer', 'Segoe UI', sans-serif;
        color: var(--paper);
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(
          1200px 800px at 50% 40%,
          #145a52 0%,
          #0b2f2b 55%,
          #061714 100%
        );
      }
      .abs {
        position: absolute;
      }
      .center {
        left: 50%;
        top: 50%;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .glyph {
        position: absolute;
        font-family: 'Noto Sans Khmer';
        font-weight: 600;
        color: var(--mint);
        will-change: transform, opacity;
      }
      .km {
        font-family: 'Kantumruy Pro', 'Noto Sans Khmer';
      }
      .en {
        font-family: 'Segoe UI', 'Kantumruy Pro', sans-serif;
        letter-spacing: 0.01em;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 12px 28px;
        border-radius: 999px;
        background: rgba(139, 219, 194, 0.14);
        border: 2px solid rgba(139, 219, 194, 0.45);
        font-size: 30px;
        font-weight: 600;
        color: var(--mint);
      }
      .heading {
        width: 100%;
        text-align: center;
      }
      .heading .km {
        font-size: 58px;
        font-weight: 600;
        line-height: 1.6;
      }
      .heading .en {
        font-size: 30px;
        color: var(--muted);
        margin-top: 2px;
      }

      /* intro */
      #logo {
        width: 230px;
        height: 230px;
        margin: -115px 0 0 -115px;
      }
      #ring {
        width: 240px;
        height: 240px;
        margin: -120px 0 0 -120px;
        border-radius: 60px;
        border: 4px solid var(--gold);
      }
      #title {
        width: 100%;
        text-align: center;
        top: 640px;
        font-size: 128px;
        font-weight: 600;
        font-family: 'Segoe UI', sans-serif;
        letter-spacing: 0.02em;
      }
      #title span {
        display: inline-block;
      }
      #subtitle {
        width: 100%;
        text-align: center;
        top: 810px;
        font-size: 54px;
        font-weight: 600;
        color: var(--mint);
        line-height: 1.6;
      }
      #subtitle-en {
        width: 100%;
        text-align: center;
        top: 905px;
        font-size: 30px;
        color: var(--muted);
      }
      .spark {
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        background: var(--gold);
      }

      /* keyboard scene */
      #track {
        left: 50%;
        top: 250px;
        width: 1100px;
        margin-left: -550px;
        height: 170px;
        border-radius: 28px;
        background: rgba(247, 248, 250, 0.07);
        border: 2px solid rgba(247, 248, 250, 0.16);
      }
      #track .txt {
        position: absolute;
        left: 60px;
        top: 14px;
        font-family: 'Noto Sans Khmer';
        font-size: 84px;
        font-weight: 600;
        line-height: 1.6;
        white-space: pre;
      }
      #target {
        color: rgba(247, 248, 250, 0.28);
      }
      #typed {
        color: var(--gold);
      }
      #caret {
        position: absolute;
        top: 38px;
        width: 6px;
        height: 96px;
        border-radius: 3px;
        background: var(--paper);
      }
      #badge {
        right: 34px;
        top: 46px;
        height: 78px;
        padding: 0 26px;
        border-radius: 40px;
        background: var(--gold);
        color: var(--ink);
        font-size: 40px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #kb {
        left: 50%;
        top: 470px;
      }
      .key {
        position: absolute;
        border-radius: 14px;
        background: #f3f6f5;
        color: #11302c;
        overflow: hidden;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
      }
      .key .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 9px;
      }
      .key .base {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 14px;
        text-align: center;
        font-family: 'Noto Sans Khmer';
        font-size: 34px;
        font-weight: 600;
        line-height: 1.5;
      }
      .key .shift {
        position: absolute;
        left: 10px;
        top: 2px;
        font-family: 'Noto Sans Khmer';
        font-size: 19px;
        color: #5d736f;
        line-height: 1.5;
      }
      .key .lbl {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        margin-top: -14px;
        text-align: center;
        font-size: 20px;
        font-family: 'Segoe UI';
        color: #5d736f;
      }
      .key .fill {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .key.pressed .base,
      .key.pressed .lbl,
      .key.pressed .shift {
        color: #fff;
      }
      .tag {
        position: absolute;
        padding: 6px 18px;
        border-radius: 999px;
        color: #fff;
        font-size: 24px;
        font-weight: 600;
        white-space: nowrap;
        line-height: 1.5;
      }
      #legend {
        left: 50%;
        top: 958px;
        transform: translateX(-50%);
        display: flex;
        gap: 34px;
        font-size: 26px;
        white-space: nowrap;
      }
      #legend div {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #legend i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: inline-block;
      }

      /* learning */
      .card {
        width: 440px;
        height: 420px;
        border-radius: 34px;
        background: var(--paper);
        color: #11302c;
        padding: 40px 40px;
      }
      .card .g {
        font-size: 30px;
        color: var(--teal);
        font-weight: 600;
      }
      .card .big {
        font-size: 64px;
        font-weight: 600;
        line-height: 1.5;
        margin-top: 4px;
      }
      .card .sub {
        font-size: 28px;
        color: #5d736f;
      }
      .card .stars {
        display: flex;
        gap: 16px;
        margin-top: 36px;
      }
      .card .stars svg {
        width: 70px;
        height: 70px;
      }
      .card .bar {
        margin-top: 34px;
        height: 16px;
        border-radius: 8px;
        background: #dfe9e6;
        overflow: hidden;
      }
      .card .bar b {
        display: block;
        height: 100%;
        width: 0;
        background: var(--teal);
        border-radius: 8px;
      }

      /* typing stats */
      .stat {
        width: 470px;
        height: 470px;
        border-radius: 40px;
        background: rgba(247, 248, 250, 0.07);
        border: 2px solid rgba(247, 248, 250, 0.16);
      }
      .stat .label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 38px;
        text-align: center;
        font-size: 30px;
        color: var(--muted);
        line-height: 1.5;
      }
      .stat .num {
        position: absolute;
        left: 0;
        right: 0;
        top: 120px;
        text-align: center;
        font-size: 150px;
        font-weight: 600;
        font-family: 'Segoe UI';
        color: var(--paper);
      }
      .stat .unit {
        position: absolute;
        left: 0;
        right: 0;
        top: 300px;
        text-align: center;
        font-size: 32px;
        color: var(--gold);
        font-weight: 600;
      }

      /* features */
      .tile {
        width: 760px;
        height: 210px;
        border-radius: 34px;
        background: var(--paper);
        color: #11302c;
        display: flex;
        align-items: center;
        gap: 34px;
        padding: 0 44px;
      }
      .tile .ico {
        width: 124px;
        height: 124px;
        flex: none;
        border-radius: 30px;
        background: var(--teal);
        display: grid;
        place-items: center;
      }
      .tile .ico svg {
        width: 72px;
        height: 72px;
      }
      .tile .km {
        font-size: 44px;
        font-weight: 600;
        line-height: 1.55;
      }
      .tile .en {
        font-size: 28px;
        color: #5d736f;
      }

      /* end */
      #end-logo {
        width: 260px;
        height: 260px;
        margin: -130px 0 0 -130px;
      }
      #end-title {
        width: 100%;
        text-align: center;
        top: 600px;
        font-size: 140px;
        font-weight: 600;
        font-family: 'Segoe UI';
      }
      #end-km {
        width: 100%;
        text-align: center;
        top: 790px;
        font-size: 52px;
        font-weight: 600;
        color: var(--mint);
        line-height: 1.6;
      }
      #chips {
        left: 50%;
        top: 905px;
        transform: translateX(-50%);
        display: flex;
        gap: 22px;
      }
      #chips span {
        padding: 12px 30px;
        border-radius: 999px;
        border: 2px solid var(--gold);
        color: var(--gold);
        font-size: 30px;
        font-weight: 600;
        white-space: nowrap;
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bg" class="layer"></div>
      <div id="s1" class="layer"></div>
      <div id="s2" class="layer"></div>
      <div id="s3" class="layer"></div>
      <div id="s4" class="layer"></div>
      <div id="s5" class="layer"></div>
      <div id="s6" class="layer"></div>
      <div id="fade"></div>
    </div>
    <script>
      'use strict';
      // ---------- helpers ----------
      const FPS = 30,
        DURATION = 31;
      const clamp = (v) => Math.min(1, Math.max(0, v));
      const p = (t, a, b) => clamp((t - a) / (b - a));
      const E = {
        out: (x) => 1 - Math.pow(1 - x, 3),
        in: (x) => x * x * x,
        inOut: (x) =>
          x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
        back: (x) => {
          const c1 = 1.9,
            c3 = c1 + 1;
          return x <= 0
            ? 0
            : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        },
        elastic: (x) =>
          x <= 0
            ? 0
            : x >= 1
              ? 1
              : Math.pow(2, -10 * x) *
                  Math.sin(((x * 10 - 0.75) * (2 * Math.PI)) / 3) +
                1,
      };
      const lerp = (a, b, x) => a + (b - a) * x;
      const $ = (id) => document.getElementById(id);
      function el(tag, cls, parent, html) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html !== undefined) e.innerHTML = html;
        (parent || document.body).appendChild(e);
        return e;
      }
      function set(e, { x = 0, y = 0, s = 1, r = 0, o = 1 } = {}) {
        e.style.transform = `translate(${x}px, ${y}px) scale(${s}) rotate(${r}deg)`;
        e.style.opacity = o;
      }
      // in/out envelope: fades up between a..a+d, out between b..b+d2
      function life(t, a, d, b, d2) {
        return Math.min(E.out(p(t, a, a + d)), 1 - E.in(p(t, b, b + d2)));
      }
      let seed = 7;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const toKm = (n) => String(n).replace(/[0-9]/g, (d) => '០១២៣៤៥៦៧៨៩'[d]);

      const CUES = [];
      const cue = (t, type, extra) =>
        CUES.push(Object.assign({ t, type }, extra || {}));

      const LOGO = `<svg viewBox="0 0 256 256" width="100%" height="100%"><rect width="256" height="256" rx="56" fill="#176b62"/><rect x="32" y="64" width="192" height="128" rx="16" fill="#f7f8fa"/><g fill="#176b62"><path d="M52 84h24v24H52zm32 0h24v24H84zm32 0h24v24h-24zm32 0h24v24h-24zm32 0h24v24h-24zM52 116h24v24H52zm32 0h24v24H84zm32 0h24v24h-24zm32 0h24v24h-24zm32 0h24v24h-24z"/><rect x="68" y="152" width="120" height="20" rx="4"/></g><rect x="4" y="4" width="248" height="248" rx="54" fill="none" stroke="#8bdbc2" stroke-width="6" opacity=".55"/></svg>`;
      const STAR = (on) =>
        `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="${on ? '#e9b94c' : '#dfe9e6'}" stroke="${on ? '#c79a2e' : '#c9d6d2'}" stroke-width="1" stroke-linejoin="round"/></svg>`;

      // ---------- background ----------
      const GLYPHS = 'កខគឃងចឆជឈញដឋឌឍណតថទធនបផពភមយរលវសហឡអ';
      const bgGlyphs = [];
      for (let i = 0; i < 34; i++) {
        const g = el(
          'div',
          'glyph',
          $('bg'),
          GLYPHS[Math.floor(rnd() * GLYPHS.length)],
        );
        const size = 40 + rnd() * 110;
        g.style.fontSize = size + 'px';
        bgGlyphs.push({
          e: g,
          x: rnd() * 1920,
          y: rnd() * 1080,
          v: 10 + rnd() * 26,
          a: 0.04 + rnd() * 0.07,
          ph: rnd() * 6.28,
          d: size / 150,
        });
      }
      function renderBg(t) {
        for (const g of bgGlyphs) {
          const y =
            ((((g.y - t * g.v * (0.6 + g.d)) % 1240) + 1240) % 1240) - 120;
          const x = g.x + Math.sin(t * 0.5 + g.ph) * 18;
          const dim = 1 - 0.55 * E.inOut(p(t, 26.2, 27.2));
          set(g.e, {
            x,
            y,
            r: Math.sin(t * 0.3 + g.ph) * 8,
            o: g.a * Math.min(1, t / 1.2) * dim,
          });
        }
      }

      // ---------- scene 1: intro ----------
      const s1 = $('s1');
      const ring = el('div', 'abs center', s1);
      ring.id = 'ring';
      const sparks = [];
      for (let i = 0; i < 18; i++)
        sparks.push({
          e: el('div', 'abs center spark', s1),
          a: (i / 18) * Math.PI * 2 + rnd() * 0.3,
          d: 220 + rnd() * 160,
          s: 0.5 + rnd() * 0.9,
        });
      const logo = el('div', 'abs center', s1, LOGO);
      logo.id = 'logo';
      const title = el('div', 'abs', s1);
      title.id = 'title';
      const titleChars = [...'SvaType'].map((c) => el('span', '', title, c));
      const sub = el('div', 'abs km', s1, 'កម្មវិធីរៀនវាយអក្សរខ្មែរ');
      sub.id = 'subtitle';
      const subEn = el(
        'div',
        'abs en',
        s1,
        'Learn &amp; practise Khmer typing — for everyone',
      );
      subEn.id = 'subtitle-en';
      cue(0.25, 'whoosh', { len: 0.9 });
      cue(0.62, 'pop', { pitch: 0.8 });
      cue(0.7, 'sparkle');
      cue(1.15, 'shimmer');
      cue(3.55, 'whoosh', { len: 0.7, gain: 0.6 });
      function renderS1(t) {
        if (t > 4.4) {
          s1.style.display = 'none';
          return;
        }
        s1.style.display = '';
        const out = E.inOut(p(t, 3.55, 4.25));
        const lift = -lerp(0, 160, out);
        const k = E.back(p(t, 0.35, 1.0));
        set(logo, {
          y: -150 + lift,
          s: k * (1 - out * 0.2),
          r: lerp(-14, 0, E.out(p(t, 0.35, 1.1))),
          o: clamp(k * 3) * (1 - out),
        });
        const rp = p(t, 0.62, 1.5);
        set(ring, {
          y: -150 + lift,
          s: lerp(0.9, 2.1, E.out(rp)),
          o: (1 - rp) * (rp > 0 ? 0.9 : 0),
        });
        for (const sp of sparks) {
          const q = p(t, 0.65, 1.6),
            d = sp.d * E.out(q);
          set(sp.e, {
            x: Math.cos(sp.a) * d,
            y: -150 + Math.sin(sp.a) * d + lift,
            s: sp.s * (1 - q),
            o: q > 0 && q < 1 ? 1 : 0,
          });
        }
        titleChars.forEach((c, i) => {
          const q = E.back(p(t, 1.1 + i * 0.06, 1.6 + i * 0.06));
          set(c, { y: lerp(90, 0, q), o: clamp(q * 1.5), s: lerp(0.6, 1, q) });
        });
        set(title, { y: lift, o: 1 - out });
        set(sub, {
          y: lerp(40, 0, E.out(p(t, 1.75, 2.4))) + lift,
          o: E.out(p(t, 1.75, 2.4)) * (1 - out),
        });
        set(subEn, {
          y: lerp(30, 0, E.out(p(t, 2.05, 2.7))) + lift,
          o: E.out(p(t, 2.05, 2.7)) * (1 - out),
        });
      }

      // ---------- scene 2: keyboard + typing ----------
      const s2 = $('s2');
      const head2 = el(
        'div',
        'abs heading',
        s2,
        '<div class="km">រៀនគ្រប់គ្រាប់ចុច និងម្រាមដៃដែលត្រូវប្រើ</div><div class="en">Learn every key — and the right finger for it</div>',
      );
      head2.style.top = '70px';
      const track = el('div', 'abs', s2);
      track.id = 'track';
      const targetEl = el('div', 'txt', track);
      targetEl.id = 'target';
      const typedEl = el('div', 'txt', track);
      typedEl.id = 'typed';
      const caret = el('div', '', track);
      caret.id = 'caret';
      const badge = el('div', 'abs', track, '✓ <span class="km">១០០%</span>');
      badge.id = 'badge';
      const kb = el('div', 'abs', s2);
      kb.id = 'kb';
      const legend = el('div', 'abs', s2);
      legend.id = 'legend';

      let FINGERS = {},
        LAYOUT = {};
      const FINGER_NAME = {
        5: 'កូនដៃ',
        4: 'ម្រាមនាង',
        3: 'ម្រាមកណ្ដាល',
        2: 'ម្រាមចង្អុល',
        1: 'មេដៃ',
      };
      const U = 80,
        GAP = 8;
      const ROWS = [
        [
          ['Backquote'],
          ['Digit1'],
          ['Digit2'],
          ['Digit3'],
          ['Digit4'],
          ['Digit5'],
          ['Digit6'],
          ['Digit7'],
          ['Digit8'],
          ['Digit9'],
          ['Digit0'],
          ['Minus'],
          ['Equal'],
          ['Backspace', 2, '⌫', 'R5'],
        ],
        [
          ['Tab', 1.5, 'Tab', 'L5'],
          ['KeyQ'],
          ['KeyW'],
          ['KeyE'],
          ['KeyR'],
          ['KeyT'],
          ['KeyY'],
          ['KeyU'],
          ['KeyI'],
          ['KeyO'],
          ['KeyP'],
          ['BracketLeft'],
          ['BracketRight'],
          ['Backslash', 1.5],
        ],
        [
          ['CapsLock', 1.75, 'Caps', 'L5'],
          ['KeyA'],
          ['KeyS'],
          ['KeyD'],
          ['KeyF'],
          ['KeyG'],
          ['KeyH'],
          ['KeyJ'],
          ['KeyK'],
          ['KeyL'],
          ['Semicolon'],
          ['Quote'],
          ['Enter', 2.25, 'Enter', 'R5'],
        ],
        [
          ['ShiftLeft', 2.25, 'Shift', 'L5'],
          ['KeyZ'],
          ['KeyX'],
          ['KeyC'],
          ['KeyV'],
          ['KeyB'],
          ['KeyN'],
          ['KeyM'],
          ['Comma'],
          ['Period'],
          ['Slash'],
          ['ShiftRight', 2.75, 'Shift', 'R5'],
        ],
        [
          ['CtrlL', 1.25, 'Ctrl'],
          ['Win', 1.25, '⊞'],
          ['Alt', 1.25, 'Alt'],
          ['Space', 6.25, '', 'L1'],
          ['AltGr', 1.25, 'AltGr'],
          ['Fn', 1.25, 'Fn'],
          ['Menu', 1.25, '☰'],
          ['CtrlR', 1.25, 'Ctrl'],
        ],
      ];
      const KEYS = {};
      const KB_W = 15 * U + 14 * GAP;
      function buildKeyboard() {
        kb.style.marginLeft = -KB_W / 2 + 'px';

                upto: i,
                t: TYPE_START + n * TYPE_STEP,

        renderS1(t);
        renderS2(t);
        renderS3(t);
        renderS4(t);
        renderS5(t);
        renderS6(t);
        $('fade').style.opacity = Math.max(
          1 - p(t, 0, 0.35),
          E.in(p(t, 30.2, 31)),
        );
      }
      window.renderAt = renderAt;
      window.DURATION = DURATION;
      window.FPS = FPS;
      window.ready = (async () => {
        const [layout, fingers] = await Promise.all([
          fetch('/content/layouts/nida.json').then((r) => r.json()),
          fetch('/content/fingers.json').then((r) => r.json()),
        ]);
        LAYOUT = layout.keys;
        for (const f of fingers.fingers) FINGERS[f.id] = f.color;
        buildKeyboard();
        planStrokes();
        cue(DONE_T(), 'ding');
        cue(10.85, 'whoosh', { len: 0.6, gain: 0.5 });
        cue(0, 'music');
        CUES.sort((a, b) => a.t - b.t);
        window.CUES = CUES;
        await document.fonts.ready;
        await Promise.all(
          [...document.fonts].map((f) => f.load().catch(() => {})),
        );
        renderAt(0);
        return true;
      })();
      // Live preview when opened directly: ?play
      if (location.search.includes('play'))
        window.ready.then(() => {
          const t0 = performance.now();
          const loop = () => {
            renderAt(((performance.now() - t0) / 1000) % DURATION);
            requestAnimationFrame(loop);
          };
          loop();
        });
    </script>
  </body>
</html>

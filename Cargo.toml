[workspace]
members = ["crates/khmer_core", "crates/khmer_wasm", "src-tauri", "scripts/dump-layout"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
strip = "debuginfo"
